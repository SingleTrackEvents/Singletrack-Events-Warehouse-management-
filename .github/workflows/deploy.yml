# Builds the app and publishes it to GitHub Pages.
#
# Pages serves the site over HTTPS, which the camera scanner needs — browsers
# only expose getUserMedia on a secure origin. It also makes the app installable
# on a phone's home screen.
#
# `enablement: true` below turns Pages on via the API on the first run, so there
# is no manual setting to find in the repo settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/warehouse-management-trail-events-wrbycb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types, lint and tests
        run: |
          npm run lint
          npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Switches Pages on and points it at Actions if it is not set up yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
